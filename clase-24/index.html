<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear película</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
      padding: 40px 20px;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 30px;
    }

    form {
      background: white;
      padding: 25px;
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 4px 15px #0000000a;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #6366f1;
      border-color: transparent;
    }

    button {
      width: 100%;
      padding: 13px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .film-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 25px #0000000a;
    }

    .film-header {
      background: #4f46e5;
      color: white;
      padding: 25px;
    }

    .film-header span {
      display: inline-block;
      background: #ffffff30;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .film-header h3 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .film-header p {
      color: #e0e7ff;
    }

    .film-details {
      padding: 25px;
    }

    .detail {
      margin-bottom: 20px;
    }

    .detail:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      display: block;
      color: #64748b;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .detail-value {
      font-size: 15px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .genre {
      display: inline-block;
      color: #4338ca;
      background: #eef2ff;
      padding: 7px 12px;
      border-radius: 20px;
    }

    #result {
      color: #64748b;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main>
    <h1>Crear película</h1>

    <form id="filmForm">
      <label for="title">Título</label>
      <input type="text" id="title" value="Coward 2" required>

      <label for="year">Año</label>
      <input type="number" id="year" value="2026" required>

      <label for="genre">Género</label>
      <input type="text" id="genre" value="Romance" required>

      <button type="submit">Crear película</button>
    </form>

    <h2>Resultado</h2>

    <p id="result">Todavía no se creó ninguna película.</p>

    <article id="filmCard" class="film-card hidden">
      <div class="film-header">
        <span>PELÍCULA CREADA</span>
        <h3 id="filmTitle"></h3>
        <p id="filmYear"></p>
      </div>

      <div class="film-details">
        <div class="detail">
          <span class="detail-label">Género</span>
          <span id="filmGenre" class="genre"></span>
        </div>

        <div class="detail">
          <span class="detail-label">ID de MongoDB</span>
          <p id="filmId" class="detail-value"></p>
        </div>
      </div>
    </article>
  </main>

  <script>
    const form = document.querySelector("#filmForm")
    const result = document.querySelector("#result")
    const filmCard = document.querySelector("#filmCard")

    form.addEventListener("submit", async (event) => {
      event.preventDefault()

      const newFilm = {
        title: document.querySelector("#title").value,
        year: Number(document.querySelector("#year").value),
        genre: document.querySelector("#genre").value
      }

      result.textContent = "Creando película..."
      filmCard.classList.add("hidden")

      try {
        const response = await fetch("http://localhost:3000/films", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(newFilm)
        })

        const data = await response.json()

        if (!response.ok) {
          throw new Error(data.error || "No se pudo crear la película")
        }

        document.querySelector("#filmTitle").textContent = data.title
        document.querySelector("#filmYear").textContent = `Estreno: ${data.year}`
        document.querySelector("#filmGenre").textContent = data.genre
        document.querySelector("#filmId").textContent = data._id

        result.textContent = ""
        filmCard.classList.remove("hidden")
      } catch (error) {
        result.textContent = "Error: " + error.message
      }
    })
  </script>
</body>

</html>
